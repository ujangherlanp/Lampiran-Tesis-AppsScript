  <script type="text/babel">
    // --- GAS MOCK UNTUK PREVIEW LOKAL ---
    if (typeof window.google === 'undefined' || typeof window.google.script === 'undefined') {
      window.google = {
        script: {
          run: {
            withSuccessHandler: function(callback) {
              return {
                getQuizzesFromDB: function() { setTimeout(() => callback(JSON.parse(localStorage.getItem('gas_mock_quizzes') || '[]')), 300); },
                getProgressFromDB: function() { setTimeout(() => callback(JSON.parse(localStorage.getItem('gas_mock_progress') || '[]')), 300); },
                saveQuizToDB: function(data) {
                  const q = JSON.parse(localStorage.getItem('gas_mock_quizzes') || '[]');
                  const newQuiz = JSON.parse(data);
                  const existingIdx = q.findIndex(x => x.id === newQuiz.id);
                  if(existingIdx >= 0) q[existingIdx] = newQuiz; else q.push(newQuiz);
                  localStorage.setItem('gas_mock_quizzes', JSON.stringify(q));
                  setTimeout(() => callback && callback(true), 300);
                },
                saveProgressToDB: function(data) {
                  const p = JSON.parse(localStorage.getItem('gas_mock_progress') || '[]');
                  p.push(JSON.parse(data));
                  localStorage.setItem('gas_mock_progress', JSON.stringify(p));
                  setTimeout(() => callback && callback(true), 300);
                },
                generateQuizPdf: function(data) {
                    setTimeout(() => callback({success: false, error: "Mock lokal tidak bisa buat PDF, jalankan di Apps Script."}), 1000);
                },
                uploadImageToDrive: function(base64, name) {
                    setTimeout(() => callback(base64), 800); 
                }
              };
            },
            withFailureHandler: function(errCallback) {
                this.failureCallback = errCallback;
                return this;
            }
          }
        }
      };
    }

    const { useState, useEffect, useRef, useMemo } = React;

    // --- ICONS ---

    const IconArrowLeft = ({size=24}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>;
    const IconPlusCircle = ({size=20}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>;
    const IconPlay = ({size=20}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>;
    const IconDatabase = ({size=20}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></svg>;
    const IconTrash2 = ({size=18}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>;
    const IconImage = ({size=16}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>;
    const IconSave = ({size=20}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>;

    const IconLock = ({size=20}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>;
    const IconChevronUp = ({size=20}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>;
    const IconChevronDown = ({size=20}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>;
    const IconLoader = ({size=16}) => <svg className="animate-spin" xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg>;

    const generateId = () => Math.random().toString(36).substr(2, 9);
    const generateQuizCode = () => Math.floor(100000 + Math.random() * 900000).toString();

    const compressImage = (file, callback) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          const MAX_WIDTH = 500; 
          let width = img.width;
          let height = img.height;
          if (width > MAX_WIDTH) { height = Math.round((height * MAX_WIDTH) / width); width = MAX_WIDTH; }
          canvas.width = width; canvas.height = height;
          ctx.drawImage(img, 0, 0, width, height);
          callback(canvas.toDataURL('image/jpeg', 0.6));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    };

    // --- KOMPONEN TOMBOL OPSI PADA HP ---
    function OptionButton({ opt, index, onSelect }) {
      const touchPosRef = useRef({ x: 0, y: 0 });
      const isDraggingRef = useRef(false);

      const handleTouchStart = (e) => {
        touchPosRef.current = {
          x: e.touches[0].clientX,
          y: e.touches[0].clientY
        };
        isDraggingRef.current = false;
      };

      const handleTouchMove = (e) => {
        const moveX = Math.abs(e.touches[0].clientX - touchPosRef.current.x);
        const moveY = Math.abs(e.touches[0].clientY - touchPosRef.current.y);
        if (moveX > 8 || moveY > 8) {
          isDraggingRef.current = true;
        }
      };

      const handleClick = (e) => {
        if (isDraggingRef.current) {
          e.preventDefault();
          e.stopPropagation();
          isDraggingRef.current = false;
          return;
        }
        onSelect(opt);
      };

      return (
        <button
          type="button"
          onTouchStart={handleTouchStart}
          onTouchMove={handleTouchMove}
          onClick={handleClick}
          className="text-left p-5 rounded-2xl border-2 border-slate-100 hover:border-blue-400 hover:bg-blue-50 bg-white transition-all group flex items-start gap-4 shadow-sm hover:shadow-md active:scale-[0.98] select-none touch-manipulation"
        >
          <div className="w-8 h-8 rounded-full bg-slate-100 text-slate-500 group-hover:bg-blue-600 group-hover:text-white flex items-center justify-center font-bold shrink-0 transition-colors pointer-events-none">
            {String.fromCharCode(65 + index)}
          </div>
        <div 
        className="flex-1 mt-0.5 overflow-x-auto overflow-y-hidden pb-2 [&::-webkit-scrollbar]:h-1.5 [&::-webkit-scrollbar-thumb]:bg-slate-300 [&::-webkit-scrollbar-thumb]:rounded-full"
        onScroll={() => { isDraggingRef.current = true; }}
        >
          {opt.image && <img src={opt.image} alt="Opsi" className="max-h-32 mb-3 rounded-xl border border-slate-200 shadow-sm pointer-events-none" />}
          {opt.title && <div className="font-bold text-slate-700 text-lg group-hover:text-blue-900 pointer-events-none break-words" dangerouslySetInnerHTML={{__html: opt.title}}></div>}
        </div>
        </button>
      );
    }

    function App() {
      const [currentView, setCurrentView] = useState('studentLogin'); 
      const [quizzes, setQuizzes] = useState([]);
      const [progressData, setProgressData] = useState([]);
      const [isLoading, setIsLoading] = useState(true);
      const [toastMsg, setToastMsg] = useState('');

      useEffect(() => {
        if (toastMsg) {
          const timer = setTimeout(() => setToastMsg(''), 4000);
          return () => clearTimeout(timer);
        }
      }, [toastMsg]);

      useEffect(() => {
        setIsLoading(true);
        window.google.script.run
            .withFailureHandler((err) => {
                console.error("Gagal koneksi ke Google Sheet (Quizzes):", err);
                setIsLoading(false);
                setToastMsg("Gagal memuat sistem, silakan muat ulang halaman.");
            })
            .withSuccessHandler((data) => {
                const uniqueQuizzes = {};
                
                (data || []).forEach(item => {
                    try {
                        const q = typeof item === 'string' ? JSON.parse(item) : item;
                        if (q && q.id) uniqueQuizzes[q.id] = q;
                    } catch(e) {
                        console.error("Format kuis ada yang corrupt/rusak, dilewati.", e);
                    }
                });
                
                setQuizzes(Object.values(uniqueQuizzes));
                
                window.google.script.run
                    .withFailureHandler((err) => {
                        console.error("Gagal koneksi ke Google Sheet (Progress):", err);
                        setIsLoading(false); 
                    })
                    .withSuccessHandler((progData) => {
                        const parsedProg = [];
                        (progData || []).forEach(item => {
                            try {
                                const p = typeof item === 'string' ? JSON.parse(item) : item;
                                if(p) parsedProg.push(p);
                            } catch(e) {
                                console.error("Format progress ada yang corrupt/rusak, dilewati.", e);
                            }
                        });
                        
                        setProgressData(parsedProg);
                        setIsLoading(false);
                    }).getProgressFromDB();
            }).getQuizzesFromDB();
      }, []);

      const handleSaveQuiz = (newQuiz, isNew) => {
        const existingIdx = quizzes.findIndex(q => q.id === newQuiz.id);
        const updatedQuizzes = [...quizzes];
        if (existingIdx >= 0) updatedQuizzes[existingIdx] = newQuiz;
        else updatedQuizzes.push(newQuiz);
        setQuizzes(updatedQuizzes);
        
        window.google.script.run
          .withFailureHandler((err) => {
            console.error("Gagal menyimpan ke Google Spreadsheet:", err);
            setToastMsg('❌ Gagal menyimpan ke Spreadsheet! Periksa jaringan.');
          })
          .withSuccessHandler(() => {
            setToastMsg(isNew ? '✨ Evaluasi sukses dibuat!' : '✅ Perubahan disimpan!');
          }).saveQuizToDB(JSON.stringify(newQuiz));
      };

      const handleDeleteQuizLocally = (id) => {
        setQuizzes(quizzes.filter(q => q.id !== id));
        localStorage.removeItem(`quiz_draft_${id}`);
        setToastMsg('🗑️ Kuis dihapus dari tampilan.');
      };

      const handleSaveProgress = (data) => {
        setProgressData([...progressData, data]);
        window.google.script.run.withSuccessHandler(() => console.log('Progress tersimpan!')).saveProgressToDB(JSON.stringify(data));
      };

      if (isLoading) {
        return (
          <div className="flex h-screen items-center justify-center bg-slate-50">
            <div className="text-center">
              <div className="w-14 h-14 border-4 border-t-blue-600 border-blue-200 rounded-full animate-spin mx-auto mb-4"></div>
              <p className="text-sm font-bold text-slate-500 uppercase tracking-widest animate-pulse">Menyiapkan test...</p>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 relative">
          {toastMsg && (
            <div className="fixed top-6 right-6 z-50 animate-fade-in">
              <div className="bg-slate-800 text-white px-6 py-3 rounded-2xl shadow-xl font-bold flex items-center gap-3 border border-slate-700">
                {toastMsg}
              </div>
            </div>
          )}

          {currentView === 'studentLogin' && <StudentLoginView onGoAdmin={() => setCurrentView('adminLogin')} quizzes={quizzes} onStartQuiz={(quizData) => setCurrentView(quizData)} />}
          {currentView === 'adminLogin' && <AdminLoginView onBack={() => setCurrentView('studentLogin')} onLoginSuccess={() => setCurrentView('admin')} />}
          {currentView === 'admin' && <AdminDashboard quizzes={quizzes} progressData={progressData} onSaveQuiz={handleSaveQuiz} onDeleteQuiz={handleDeleteQuizLocally} setToastMsg={setToastMsg} onBack={() => setCurrentView('studentLogin')} />}
          {typeof currentView === 'object' && <StudentPortal initData={currentView} onFinish={handleSaveProgress} onBack={() => setCurrentView('studentLogin')} />}
        </div>
      );
    }

    function StudentLoginView({ onGoAdmin, quizzes, onStartQuiz }) {
      const [name, setName] = useState('');
      const [kelas, setKelas] = useState('');
      const [code, setCode] = useState('');
      const [errorMsg, setErrorMsg] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        setErrorMsg('');
        const codeClean = code.trim().toString();
        const found = quizzes.find(q => q.code && q.code.toString() === codeClean);
        
        if (!found) return setErrorMsg("Kode kuis tidak ditemukan. Silakan periksa kembali!");
        if (!found.mainNodes || found.mainNodes.length === 0) return setErrorMsg("Kuis belum memiliki soal yang valid.");
        
        onStartQuiz({ quiz: found, studentName: name, kelas: kelas });
      };

      return (
        <div className="relative min-h-screen flex flex-col items-center justify-center bg-math-pattern overflow-hidden">
          <div className="absolute inset-0 pointer-events-none opacity-[0.06] flex items-center justify-center">
             <svg width="900" height="900" viewBox="0 0 900 900" xmlns="http://www.w3.org/2000/svg" className="text-blue-900">
                <text x="450" y="80" textAnchor="middle" fontSize="36" fontFamily="sans-serif" fontWeight="900" fill="currentColor">BENTUK ALJABAR</text>
                <text x="140" y="160" fontSize="28" fontFamily="sans-serif" fontWeight="bold" fill="currentColor">5x + 4</text>
                <text x="680" y="160" fontSize="28" fontFamily="sans-serif" fontWeight="bold" fill="currentColor">2x+3y-3</text>
             </svg>
          </div>

          <div className="absolute top-6 right-6 z-20">
            <button onClick={onGoAdmin} className="flex items-center gap-2 bg-white/60 hover:bg-white/90 backdrop-blur-md px-4 py-2 rounded-full text-sm font-bold text-slate-500 hover:text-blue-600 transition-all shadow-sm border border-slate-200/50">
              <IconSettings /> <span>Peneliti</span>
            </button>
          </div>

          <div className="z-10 w-full max-w-md p-4 animate-fade-in">
            <div className="text-center mb-8">
              <div className="inline-flex items-center justify-center w-16 h-16 bg-blue-600 text-white rounded-2xl shadow-xl shadow-blue-600/30 mb-5 transform rotate-3">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
              </div>
              <h1 className="text-3xl font-extrabold text-slate-800 tracking-tight">Test Adaptive</h1>
              <p className="text-sm font-semibold text-slate-500 mt-2">Sistem Adaptive Scaffolding Tesis</p>
            </div>

            <form onSubmit={handleSubmit} className="glass-card p-8 rounded-[2rem] shadow-2xl shadow-slate-200/50 space-y-5">
              {errorMsg && (
                <div className="bg-red-50 text-red-600 p-3 rounded-xl text-sm font-bold border border-red-200 text-center">
                  {errorMsg}
                </div>
              )}
              <div>
                <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 ml-1">Nama Lengkap</label>
                <input required type="text" value={name} onChange={e => setName(e.target.value)} className="w-full p-4 border border-slate-200 rounded-2xl bg-white/80 focus:bg-white focus:ring-4 focus:ring-blue-100 focus:border-blue-400 outline-none font-semibold text-slate-700 transition-all placeholder-slate-400" placeholder="Masukkan nama Anda" />
              </div>
              <div>
                <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 ml-1">Kelas</label>
                <input required type="text" value={kelas} onChange={e => setKelas(e.target.value)} className="w-full p-4 border border-slate-200 rounded-2xl bg-white/80 focus:bg-white focus:ring-4 focus:ring-blue-100 focus:border-blue-400 outline-none font-semibold text-slate-700 transition-all placeholder-slate-400" placeholder="Misal: 7A atau 7B" />
              </div>
              <div className="pt-2">
                <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 ml-1">Kode kuis</label>
                <input required type="text" maxLength={6} value={code} onChange={e => setCode(e.target.value)} className="w-full p-4 border border-slate-200 rounded-2xl bg-slate-100 focus:bg-white focus:ring-4 focus:ring-blue-100 focus:border-blue-400 outline-none font-mono text-center text-3xl font-black tracking-[0.3em] text-blue-700 transition-all placeholder-slate-300" placeholder="000000" />
              </div>
              <button type="submit" className="w-full py-4 mt-4 bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-2xl font-bold text-lg hover:from-blue-500 hover:to-indigo-500 shadow-lg shadow-blue-600/30 transition-all transform hover:-translate-y-0.5">
                Mulai test
              </button>

    function QuizBuilder({ quizzes, onSave, onDelete, setToastMsg, editingQuiz, setEditingQuiz }) {
      const [quizTitle, setQuizTitle] = useState('');
      const [quizCode, setQuizCode] = useState('');
      const [mainNodes, setMainNodes] = useState([]);
      const [confirmDeleteId, setConfirmDeleteId] = useState(null);

      useEffect(() => {
        if (editingQuiz && !editingQuiz.isNew) {
          const draftKey = `quiz_draft_${editingQuiz.id}`;
          const savedDraft = localStorage.getItem(draftKey);
          if (savedDraft) {
            try {
              const draftObj = JSON.parse(savedDraft);
              setQuizTitle(draftObj.title !== undefined ? draftObj.title : editingQuiz.title);
              setQuizCode(draftObj.code || editingQuiz.code);
              setMainNodes(draftObj.mainNodes || editingQuiz.mainNodes || []);
              setToastMsg("ℹ️ Draft editan terakhir dipulihkan otomatis.");
              return;
            } catch(e) {}
          }
          setQuizTitle(editingQuiz.title || ''); 
          setQuizCode(editingQuiz.code || generateQuizCode()); 
          setMainNodes(editingQuiz.mainNodes || []);
        } else if (editingQuiz && editingQuiz.isNew) {
          const draftKey = `quiz_draft_new`;
          const savedDraft = localStorage.getItem(draftKey);
          if (savedDraft) {
            try {
              const draftObj = JSON.parse(savedDraft);
              setQuizTitle(draftObj.title || '');
              setQuizCode(draftObj.code || generateQuizCode());
              setMainNodes(draftObj.mainNodes || []);
              setToastMsg("ℹ️ Draft kuis baru dipulihkan otomatis.");
              return;
            } catch(e) {}
          }
          setQuizTitle(''); 
          setQuizCode(generateQuizCode()); 
          setMainNodes([]);
        }
      }, [editingQuiz]);

      useEffect(() => {
        if (!editingQuiz) return;
        const draftKey = editingQuiz.isNew ? `quiz_draft_new` : `quiz_draft_${editingQuiz.id}`;
        if (quizTitle || mainNodes.length > 0) {
          const draftData = { title: quizTitle, code: quizCode, mainNodes };
          localStorage.setItem(draftKey, JSON.stringify(draftData));
        }
      }, [quizTitle, quizCode, mainNodes, editingQuiz]);

      const handleAddMainNode = () => {
        setMainNodes([...mainNodes, { id: generateId(), label: `Soal Utama ${mainNodes.length + 1}`, type: 'Utama', title: '', text: '', image: '', questionQuery: '', points: 10, options: [] }]);
      };

      const handleSave = () => {
        if(!quizTitle.trim()) {
            setToastMsg("Judul kuis tidak boleh kosong!");
            return;
        }
        const quizId = (editingQuiz && !editingQuiz.isNew) ? editingQuiz.id : generateId();
        const payload = { 
            id: quizId, 
            code: quizCode, 
            title: quizTitle, 
            mainNodes, 
            createdAt: (editingQuiz && !editingQuiz.isNew && editingQuiz.createdAt) ? editingQuiz.createdAt : new Date().toISOString(),
            updatedAt: new Date().toISOString()
        };

        const draftKey = (editingQuiz && !editingQuiz.isNew) ? `quiz_draft_${editingQuiz.id}` : `quiz_draft_new`;
        localStorage.removeItem(draftKey);

        onSave(payload, !editingQuiz || editingQuiz.isNew);
        setEditingQuiz(null);
      };

      if (!editingQuiz) {
        return (
          <div>
            <div className="flex justify-between items-center mb-8">
              <div>
                <h2 className="text-3xl font-black text-slate-800 tracking-tight">Dashboard Kuis</h2>
                <p className="text-slate-500 font-medium mt-1">Kelola bank soal evaluasi adaptive Anda</p>
              </div>
              <button onClick={() => setEditingQuiz({ isNew: true })} className="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white px-6 py-3 rounded-2xl font-bold shadow-lg shadow-blue-500/30 flex items-center gap-2 transition-all transform hover:-translate-y-0.5">
                <IconPlusCircle /> Buat Kuis Baru
              </button>
            </div>

            {quizzes.length === 0 ? (
              <div className="bg-white border-2 border-dashed border-slate-200 rounded-[2rem] p-16 text-center">
                <div className="text-slate-300 flex justify-center mb-4"><IconDatabase size={48} /></div>
                <h3 className="text-xl font-bold text-slate-700 mb-2">Belum ada kuis</h3>
                <p className="text-slate-500 mb-6">Mulai buat evaluasi adaptive pertama Anda.</p>
              </div>
            ) : (
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                {quizzes.map(quiz => (
                  <div key={quiz.id} className="bg-white rounded-3xl p-6 border border-slate-100 shadow-sm hover:shadow-xl transition-all group relative cursor-pointer" onClick={() => setEditingQuiz(quiz)}>
                    <div className="absolute top-5 right-5 flex gap-1.5 opacity-0 group-hover:opacity-100 transition-opacity">
                      <button title="Edit Kuis" onClick={(e) => { e.stopPropagation(); setEditingQuiz(quiz); }} className="text-slate-400 hover:text-blue-600 bg-slate-50 hover:bg-blue-50 p-2 rounded-xl transition-colors shadow-sm"><IconEdit size={18} /></button>
                      <button title="Hapus Kuis" onClick={(e) => { 
                          e.stopPropagation(); 
                          if (confirmDeleteId === quiz.id) { onDelete(quiz.id); setConfirmDeleteId(null); }
                          else { setConfirmDeleteId(quiz.id); setTimeout(() => setConfirmDeleteId(null), 3000); }
                      }} className={`p-2 rounded-xl transition-colors shadow-sm ${confirmDeleteId === quiz.id ? 'bg-red-500 text-white' : 'text-slate-400 hover:text-red-600 bg-slate-50 hover:bg-red-50'}`}>
                          {confirmDeleteId === quiz.id ? <span className="text-xs font-bold px-1">Yakin?</span> : <IconTrash2 size={18} />}
                      </button>
                    </div>
                    <div className="bg-blue-50 w-12 h-12 rounded-2xl flex items-center justify-center text-blue-600 mb-5 border border-blue-100">
                       <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                    </div>
                    <h3 className="font-extrabold text-lg text-slate-800 mb-1 truncate pr-24">{quiz.title}</h3>
                    <div className="flex items-center gap-3 mt-4">
                      <span className="bg-slate-100 text-slate-600 font-mono text-xs px-2.5 py-1 rounded-md font-bold tracking-widest">{quiz.code}</span>
                      <span className="text-xs font-bold text-slate-400">{quiz.mainNodes ? quiz.mainNodes.length : 0} Soal Utama</span>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      }

      return (
        <div className="w-full pb-20">
          <div className="flex items-center justify-between mb-8 sticky top-0 bg-slate-50/90 backdrop-blur-md py-4 z-20 border-b border-slate-200/50">
            <div>
              <button onClick={() => setEditingQuiz(null)} className="text-sm font-bold text-slate-500 hover:text-slate-800 flex items-center gap-2 mb-2"><IconArrowLeft size={16}/> Batal</button>
              <h2 className="text-3xl font-black text-slate-800">{(editingQuiz && !editingQuiz.isNew) ? 'Edit Kuis' : 'Buat Kuis Baru'}</h2>
            </div>
            <button onClick={handleSave} className="bg-slate-800 hover:bg-slate-700 text-white px-8 py-3.5 rounded-2xl font-bold shadow-lg flex items-center gap-2 transition-all">
              <IconSave size={20} /> Simpan Evaluasi
            </button>
          </div>

          <div className="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-100 mb-8 flex gap-6">
            <div className="flex-1">
              <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 ml-1">Judul Kuis Evaluasi</label>
              <input type="text" value={quizTitle} onChange={e => setQuizTitle(e.target.value)} className="w-full p-4 border border-slate-200 rounded-2xl bg-slate-50 focus:bg-white focus:ring-4 focus:ring-blue-100 focus:border-blue-400 outline-none font-bold text-slate-700 text-lg" placeholder="Misal: Evaluasi Akhir Aljabar" />
            </div>
            <div className="w-48">
              <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 ml-1">Kode Akses</label>
              <div className="p-4 bg-blue-50 border border-blue-100 rounded-2xl text-center text-xl font-mono font-black text-blue-700 tracking-widest">{quizCode}</div>
            </div>
          </div>

          <div className="overflow-x-auto pb-8 w-full">
            <div className="space-y-6 w-max min-w-full pr-8">
              {mainNodes.map((node, index) => (
                <NodeEditor key={node.id} node={node} setToastMsg={setToastMsg} updateNode={(updated) => { const newNodes = [...mainNodes]; newNodes[index] = updated; setMainNodes(newNodes); }} 
                  deleteNode={() => setMainNodes(mainNodes.filter(n => n.id !== node.id))} depth={0} mainNodesList={mainNodes} />
              ))}
            </div>
          </div>

          <button onClick={handleAddMainNode} className="w-full py-5 mt-4 border-2 border-dashed border-slate-300 text-slate-500 hover:text-blue-600 hover:border-blue-400 hover:bg-blue-50 rounded-[2rem] font-bold flex justify-center items-center gap-2 transition-all">
            <IconPlusCircle /> Tambah Soal Utama Baru
          </button>
        </div>
      );
    }

    function NodeEditor({ node, updateNode, deleteNode, depth, mainNodesList, setToastMsg }) {
      const [isExpanded, setIsExpanded] = useState(depth === 0);
      const [isUploading, setIsUploading] = useState(false);
      const fileInputRef = useRef(null);
      
      const indentClass = depth > 0 
        ? "ml-8 md:ml-12 border-l-4 border-indigo-300 pl-6 my-4 min-w-[700px]" 
        : "bg-white p-6 rounded-[2rem] shadow-sm border border-slate-200 min-w-[800px]";

      const updateField = (field, value) => updateNode({ ...node, [field]: value });
      
      const insertMathSymbolToProlog = (symbol) => {
        const newVal = (node.text || '') + symbol;
        updateField('text', newVal);
      };

      const uploadImageToDriveWrapper = (file, callback) => {
        setIsUploading(true);
        setToastMsg("⏳ Sedang mengunggah gambar ke Google Drive...");
        compressImage(file, (base64) => {
          window.google.script.run
            .withSuccessHandler((url) => {
              callback(url);
              setIsUploading(false);
              setToastMsg("✅ Gambar berhasil diunggah!");
            })
            .withFailureHandler((err) => {
              setIsUploading(false);
              setToastMsg("❌ Gagal mengunggah gambar: " + err.message);
            })
            .uploadImageToDrive(base64, file.name);
        });
      };

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) uploadImageToDriveWrapper(file, (url) => updateField('image', url));
      };

      const handleAddOption = () => {
        const newOpt = { id: generateId(), title: '', isCorrect: false, routeType: 'end', deduction: 0, scaffolding: '', practiceNode: null };
        updateField('options', [...(node.options || []), newOpt]);
      };

      const updateOption = (index, updatedOpt) => {
        const newOpts = [...node.options]; newOpts[index] = updatedOpt; updateField('options', newOpts);
      };

      const removeOption = (index) => updateField('options', node.options.filter((_, i) => i !== index));

      const getAllNodesFlat = (nodes, prefix = '') => {
          let result = [];
          (nodes || []).forEach(n => {
              const nodeLabel = prefix ? `${prefix} > ${n.label || 'Sub-Latihan'}` : `Utama: ${n.label || 'Soal Utama'}`;
              result.push({ id: n.id, label: nodeLabel });
              (n.options || []).forEach((opt, optIdx) => {
                  if (opt.routeType === 'latihan' && opt.practiceNode) {
                      result = result.concat(getAllNodesFlat([opt.practiceNode], `${nodeLabel} [Opsi ${String.fromCharCode(65 + optIdx)}]`));
                  }
              });
          });
          return result;
      };

      const allAvailableNodes = getAllNodesFlat(mainNodesList);

      return (
        <div className={`${indentClass} transition-all duration-300`}>
          <div className="flex justify-between items-center mb-4 cursor-pointer" onClick={() => setIsExpanded(!isExpanded)}>
            <div className="flex items-center gap-3">
              <div className="p-2 bg-slate-100 rounded-xl text-slate-500">{isExpanded ? <IconChevronUp size={16}/> : <IconChevronDown size={16}/>}</div>
              <span className={`px-3 py-1 rounded-lg text-[10px] font-black uppercase tracking-widest ${depth === 0 ? 'bg-slate-800 text-white' : 'bg-blue-100 text-blue-700'}`}>
                {node.label}
              </span>
              <span className="text-sm font-bold text-slate-400">Poin: {node.points || 0}</span>
            </div>
            <button onClick={(e) => { e.stopPropagation(); deleteNode(); }} className="text-slate-300 hover:text-red-500 p-2"><IconTrash2 size={16}/></button>
          </div>

          {isExpanded && (
            <div className="space-y-6 mt-6 animate-fade-in">
              <div className="bg-blue-50/40 p-4 rounded-2xl border border-blue-100">
                <label className="block text-xs font-black text-blue-700 uppercase tracking-wider mb-2">Ringkasan Soal</label>
                <input type="text" value={node.title || ''} onChange={e => updateField('title', e.target.value)} className="w-full p-3 bg-white border border-blue-200 rounded-xl focus:ring-4 focus:ring-blue-100 focus:border-blue-400 outline-none text-sm font-bold text-slate-700" placeholder="Misal: Menentukan Nilai f(x) dari Grafik" />
              </div>

              <div className="bg-slate-50 p-5 rounded-2xl border border-slate-100">
                <div className="flex justify-between items-center mb-3">
                  <label className="text-xs font-bold text-slate-500 uppercase tracking-wider">Teks Opening / Deskripsi (Opsional)</label>
                  <div className="flex gap-1">
                     <button type="button" onClick={() => insertMathSymbolToProlog('$$x^2$$')} className="px-2.5 py-1.5 bg-white text-xs font-bold text-slate-600 rounded-lg hover:bg-blue-50 shadow-sm border border-slate-200">x²</button>
                     <button type="button" onClick={() => insertMathSymbolToProlog('$$\\frac{a}{b}$$')} className="px-2.5 py-1.5 bg-white text-xs font-bold text-slate-600 rounded-lg hover:bg-blue-50 shadow-sm border border-slate-200">a/b</button>
                  </div>
                </div>
                <textarea value={node.text} onChange={e => updateField('text', e.target.value)} rows="3" className="w-full p-4 bg-white border border-slate-200 rounded-xl focus:ring-4 focus:ring-blue-100 focus:border-blue-400 outline-none text-sm text-slate-700 transition-all font-medium" placeholder="Tuliskan teks pengantar, cerita, atau konteks soal di sini..."></textarea>
                
                {node.image && (
                  <div className="mt-3 relative inline-block">
                    <img src={node.image} alt="Preview" className="max-h-48 rounded-xl border border-slate-200 shadow-sm" />
                    <button type="button" onClick={() => updateField('image', '')} className="absolute -top-2 -right-2 bg-red-500 text-white rounded-full p-1 shadow-md hover:bg-red-600"><IconTrash2 size={14}/></button>
                  </div>

                <div className="mt-3 flex items-center gap-4">
                  <input type="file" accept="image/*" className="hidden" ref={fileInputRef} onChange={handleImageUpload} disabled={isUploading} />

                    {isUploading ? <><IconLoader /> Proses Upload...</> : <><IconImage /> Sisipkan Gambar Drive</>}
                  </button>
                </div>
              </div>

              <div className="bg-amber-50/50 p-5 rounded-2xl border border-amber-100/50">
                <label className="block text-xs font-bold text-amber-700 uppercase tracking-wider mb-3">Pertanyaan / Perintah</label>
                <textarea value={node.questionQuery || ''} onChange={e => updateField('questionQuery', e.target.value)} rows="2" className="w-full p-4 bg-white border border-amber-200 rounded-xl focus:ring-4 focus:ring-amber-100 focus:border-amber-400 outline-none text-sm text-slate-800 font-semibold" placeholder="Tuliskan kalimat tanya di sini..."></textarea>
                <div className="mt-4 flex items-center gap-3">
                  <label className="text-sm font-bold text-slate-600">Poin Dasar Soal Ini:</label>
                  <input type="number" value={node.points || 0} onChange={e => updateField('points', parseInt(e.target.value) || 0)} className="w-20 p-2 text-center border border-slate-200 rounded-lg bg-white font-bold" />
                </div>
              </div>

              <div className="mt-6 border-t border-slate-100 pt-6">
                <div className="flex justify-between items-center mb-4">
                  <label className="text-xs font-black text-slate-700 uppercase tracking-wider bg-slate-100 px-3 py-1 rounded-lg">Pilihan Jawaban / Jalur</label>
                  <button type="button" onClick={handleAddOption} className="text-xs font-bold text-blue-600 hover:text-blue-700 bg-blue-50 px-3 py-1.5 rounded-lg flex items-center gap-1">
                    <IconPlusCircle size={14}/> Tambah Opsi
                  </button>
                </div>

                <div className="space-y-4">
                  {(node.options || []).map((opt, optIndex) => (
                    <div key={opt.id} className={`p-4 rounded-xl border-2 transition-all ${opt.isCorrect ? 'border-green-400 bg-green-50/30' : 'border-slate-200 bg-white'}`}>

    // --- KOMPONEN PROGRESS VIEWER DENGAN FITUR FILTER & EXPORT SPREADSHEET ---
    function ProgressViewer({ data }) {
      const [filterDate, setFilterDate] = useState('');
      const [searchName, setSearchName] = useState('');
      const [filterKelas, setFilterKelas] = useState('');
      const [filterQuiz, setFilterQuiz] = useState('');

      // Daftar kelas unik untuk dropdown
      const uniqueKelasList = useMemo(() => {
        if (!data) return [];
        const setK = new Set();
        data.forEach(item => {
          if (item.kelas) setK.add(item.kelas.toString().trim());
        });
        return Array.from(setK).sort();
      }, [data]);

      // Daftar kuis unik untuk dropdown
      const uniqueQuizList = useMemo(() => {
        if (!data) return [];
        const setQ = new Set();
        data.forEach(item => {
          if (item.quizTitle) setQ.add(item.quizTitle.toString().trim());
        });
        return Array.from(setQ).sort();
      }, [data]);

      // Logika pemfilteran data
      const filteredData = useMemo(() => {
        if (!data) return [];
        return data.slice().reverse().filter(row => {
          // Filter Berdasarkan Tanggal (yyyy-mm-dd)
          if (filterDate) {
            const rowDateObj = new Date(row.date);
            if (isNaN(rowDateObj.getTime())) return false;
            const year = rowDateObj.getFullYear();
            const month = String(rowDateObj.getMonth() + 1).padStart(2, '0');
            const day = String(rowDateObj.getDate()).padStart(2, '0');
            const rowDateStr = `${year}-${month}-${day}`;
            if (rowDateStr !== filterDate) return false;
          }

          // Filter Search Nama Siswa
          if (searchName.trim()) {
            const nameMatch = row.studentName && row.studentName.toLowerCase().includes(searchName.trim().toLowerCase());
            if (!nameMatch) return false;
          }

          // Filter Kelas
          if (filterKelas) {
            if (!row.kelas || row.kelas.toString().trim().toLowerCase() !== filterKelas.toLowerCase()) return false;
          }

          // Filter Kuis
          if (filterQuiz) {
            if (!row.quizTitle || row.quizTitle.toString().trim().toLowerCase() !== filterQuiz.toLowerCase()) return false;
          }

          return true;
        });
      }, [data, filterDate, searchName, filterKelas, filterQuiz]);

      const handleResetFilter = () => {
        setFilterDate('');
        setSearchName('');
        setFilterKelas('');
        setFilterQuiz('');
      };

      const handleExportCSV = () => {
        if (!filteredData || filteredData.length === 0) {
          alert('Tidak ada data untuk diexport!');
          return;
        }

        const headers = ['Waktu', 'Nama Siswa', 'Kelas', 'Judul Kuis', 'Skor'];
        const rows = filteredData.map(row => [
          `"${new Date(row.date).toLocaleString('id-ID').replace(/"/g, '""')}"`,
          `"${(row.studentName || '').toString().replace(/"/g, '""')}"`,
          `"${(row.kelas || '').toString().replace(/"/g, '""')}"`,
          `"${(row.quizTitle || '').toString().replace(/"/g, '""')}"`,
          row.score !== undefined ? row.score : 0
        ]);

        const csvContent = '\uFEFF' + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.setAttribute('download', `Progress_Siswa_Filtered_${new Date().toISOString().slice(0, 10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      if (!data || data.length === 0) {
        return (
          <div className="bg-white border-2 border-dashed border-slate-200 rounded-[2rem] p-16 text-center">
            <h3 className="text-xl font-bold text-slate-700 mb-2">Belum ada data</h3>
            <p className="text-slate-500">Siswa belum ada yang menyelesaikan test.</p>
          </div>
        );
      }

      return (
        <div>
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
            <div>
              <h2 className="text-3xl font-black text-slate-800 tracking-tight">Progress Siswa</h2>
              <p className="text-slate-500 font-medium text-sm mt-1">
                Menampilkan <span className="font-bold text-slate-800">{filteredData.length}</span> dari total <span className="font-bold text-slate-800">{data.length}</span> data pengerjaan
              </p>
            </div>
            <button
              onClick={handleExportCSV}
              className="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-3 rounded-2xl font-bold text-sm shadow-md shadow-emerald-600/20 flex items-center justify-center gap-2 transition-all self-start md:self-auto"
            >
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
              <span>Export ke Spreadsheet (.csv)</span>
            </button>
          </div>

          {/* BOX FILTER & SEARCH */}
          <div className="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-200/80 mb-6 space-y-4">
            <div className="flex items-center gap-2 pb-2 border-b border-slate-100 text-slate-700 font-extrabold text-sm">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
              <span>Filter & Pencarian Data</span>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
              {/* Filter Tanggal */}
              <div>
                <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5 ml-1">Filter Tanggal</label>
                <input
                  type="date"
                  value={filterDate}
                  onChange={(e) => setFilterDate(e.target.value)}
                  className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-4 focus:ring-blue-100 focus:border-blue-400 outline-none text-sm font-semibold text-slate-700 transition-all cursor-pointer"
                />

              {/* Search Nama */}
              <div>
                <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5 ml-1">Cari Nama Siswa</label>

                  type="text"

              {/* Filter Kelas */}
              <div>
                <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5 ml-1">Filter Kelas</label>
                <select

                  className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-4 focus:ring-blue-100 focus:border-blue-400 outline-none text-sm font-semibold text-slate-700 transition-all cursor-pointer"

            {(filterDate || searchName || filterKelas || filterQuiz) && (
              <div className="flex justify-end pt-1">
                <button

                  className="text-xs font-bold text-red-600 hover:text-red-700 bg-red-50 hover:bg-red-100 px-3.5 py-2 rounded-xl transition-colors flex items-center gap-1.5"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
                  <span>Reset Filter</span>

          </div>

          {/* TABLE DATA */}
          <div className="bg-white rounded-[2rem] shadow-sm border border-slate-100 overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full text-left border-collapse">

    function StudentPortal({ initData, onFinish, onBack }) {
      const { quiz, studentName, kelas } = initData;
      const [mainIndex, setMainIndex] = useState(0);
      const [currentNode, setCurrentNode] = useState(null);
      const [score, setScore] = useState(0);
      const [logs, setLogs] = useState([]);
      const [scaffolding, setScaffolding] = useState(null);
      const [isFinished, setIsFinished] = useState(false);
      const [showExitConfirm, setShowExitConfirm] = useState(false);

      useEffect(() => {
        if (quiz && quiz.mainNodes && quiz.mainNodes.length > 0) {
          setCurrentNode(quiz.mainNodes[0]);
        } else {
          setIsFinished(true);
        }
      }, [quiz]);

      useEffect(() => {
        if (window.MathJax) {
          setTimeout(() => {
             window.MathJax.typesetPromise && window.MathJax.typesetPromise().catch(err => console.log('MathJax error:', err));
          }, 50);
        }
      }, [currentNode, scaffolding, isFinished]);

      const findNodeById = (nodes, id) => {
        for (let node of nodes) {
          if (node.id === id) return node;
          for (let opt of node.options || []) {
            if (opt.routeType === 'latihan' && opt.practiceNode) {
              const found = findNodeById([opt.practiceNode], id);
              if (found) return found;
            }
          }
        }
        return null;
      };

      const handleOptionSelect = (option) => {
        const isCorrect = option.isCorrect;
        const earned = option.pointEffect !== undefined ? Number(option.pointEffect) : (isCorrect ? (currentNode.points || 0) : -(option.deduction || 0));
        setScore(prev => prev + earned);

        setLogs(prev => [...prev, {
          nodeId: currentNode.id,
          nodeLabel: currentNode.label,
          selectedOption: option.title,
          isCorrect,
          earnedPoints: earned,
          timestamp: new Date().toISOString()
        }]);

        const executeNext = () => {
          if (option.routeType === 'latihan' && option.practiceNode) {
            setCurrentNode(option.practiceNode);
          } else if (option.routeType === 'goto' && option.nextNodeId) {
            const target = findNodeById(quiz.mainNodes, option.nextNodeId);
            if (target) setCurrentNode(target);
            else goToNextMain();
          } else if (option.routeType === 'retry') {
            // Tetap di node saat ini
          } else {
            goToNextMain();
          }
        };

        const fbType = option.feedbackType || (option.scaffolding ? (isCorrect ? 'correct' : 'incorrect') : 'none');

        if (fbType !== 'none' || option.scaffolding || option.feedbackImage) {
          setScaffolding({
            type: fbType,
            text: option.feedbackText !== undefined ? option.feedbackText : option.scaffolding,
            image: option.feedbackImage,
            isCorrect: isCorrect,
            buttonText: option.feedbackButtonText || 'Lanjut',
            onContinue: () => {
              setScaffolding(null);
              executeNext();
            }
          });
        } else {
          executeNext();
        }
      };

      const goToNextMain = () => {
        const nextIdx = mainIndex + 1;
        if (nextIdx < quiz.mainNodes.length) {
          setMainIndex(nextIdx);
          setCurrentNode(quiz.mainNodes[nextIdx]);
        } else {
          setIsFinished(true);
        }
      };

      const handleFinishClick = () => {
        onFinish({ studentName, kelas, quizCode: quiz.code, quizTitle: quiz.title, score, logs, date: new Date().toISOString() });
        onBack();
      };

      if (isFinished) {
        return (
          <div className="min-h-screen bg-slate-50 flex items-center justify-center p-4">
             <div className="bg-white p-10 rounded-[3rem] shadow-2xl max-w-lg w-full text-center border border-slate-100 animate-fade-in relative overflow-hidden">
                <div className="absolute top-0 left-0 w-full h-32 bg-gradient-to-br from-blue-500 to-indigo-600 opacity-10"></div>
                <div className="w-24 h-24 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner">
                   <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                </div>
                <h2 className="text-3xl font-black text-slate-800 mb-2">Evaluasi Selesai!</h2>
                <p className="text-slate-500 font-medium mb-8">Terima kasih {studentName} telah menyelesaikan tes.</p>
                
                <div className="bg-slate-50 rounded-3xl p-6 mb-8 border border-slate-100">
                   <p className="text-sm font-bold text-slate-400 uppercase tracking-widest mb-1">Total Skor Anda</p>
                   <p className="text-6xl font-black text-blue-600">{score}</p>
                </div>

                <button onClick={handleFinishClick} className="w-full py-4 bg-slate-800 hover:bg-slate-700 text-white rounded-2xl font-bold text-lg shadow-xl shadow-slate-200 transition-all">
                  Kembali ke Beranda
                </button>
             </div>
          </div>
        );
      }

      if (!currentNode) return null;

      return (
        <div className="min-h-screen bg-slate-50 flex flex-col relative">
          {showExitConfirm && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
                  <div className="bg-white p-6 rounded-3xl max-w-sm w-full text-center shadow-2xl animate-fade-in">
                      <h3 className="text-xl font-bold mb-2">Keluar Kuis?</h3>
                      <p className="text-slate-500 mb-6 font-medium">Semua progress Anda akan hilang dan tidak disimpan.</p>
                      <div className="flex gap-4">
                          <button onClick={() => setShowExitConfirm(false)} className="flex-1 py-3 bg-slate-100 text-slate-600 hover:bg-slate-200 rounded-xl font-bold transition-colors">Batal</button>
                          <button onClick={onBack} className="flex-1 py-3 bg-red-500 text-white hover:bg-red-600 rounded-xl font-bold transition-colors">Ya, Keluar</button>
                      </div>
                  </div>
              </div>
          )}

          <div className="bg-white px-6 py-4 shadow-sm border-b border-slate-200 flex justify-between items-center sticky top-0 z-10">
            <div className="flex items-center gap-3">
               <div className="w-10 h-10 rounded-xl bg-blue-100 text-blue-600 flex items-center justify-center font-bold text-xl">
                 {studentName.charAt(0).toUpperCase()}
               </div>
               <div>
                 <p className="text-sm font-bold text-slate-800">{studentName}</p>
                 <p className="text-[10px] text-slate-500 font-medium uppercase">{kelas} • {quiz.title}</p>
               </div>
            </div>
            <div className="flex items-center gap-4">
               <div className="text-right">
                 <p className="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Skor Sementara</p>
                 <p className="text-lg font-black text-slate-800">{score}</p>
               </div>
               <button onClick={() => setShowExitConfirm(true)} className="text-slate-400 hover:text-red-500 p-2 transition-colors"><IconTrash2 size={20}/></button>
            </div>
          </div>

          <div className="flex-1 overflow-y-auto p-4 md:p-8">
            <div className="max-w-3xl mx-auto">
              <div className="flex items-center gap-2 mb-8">
                 {quiz.mainNodes.map((n, i) => (
                   <div key={n.id} className={`h-2 flex-1 rounded-full transition-all ${i < mainIndex ? 'bg-blue-500' : i === mainIndex ? 'bg-blue-300' : 'bg-slate-200'}`}></div>
                 ))}
              </div>

              <div className="bg-white rounded-[2rem] shadow-xl shadow-slate-200/50 border border-slate-100 overflow-hidden animate-fade-in relative">
                 <div className="absolute top-0 left-0 w-1.5 h-full bg-blue-500"></div>
                 <div className="p-8 md:p-10">
                    <span className="inline-block px-3 py-1 bg-slate-100 text-slate-500 rounded-lg text-[10px] font-black uppercase tracking-widest mb-6">
                      {currentNode.type === 'Utama' ? `Soal Utama ${mainIndex + 1}` : 'Soal Bantuan (Scaffolding)'}
                    </span>
                   {currentNode.text && (
                      <div className="text-slate-600 font-medium text-lg mb-6 leading-relaxed whitespace-pre-wrap" dangerouslySetInnerHTML={{__html: currentNode.text}}></div>
                    )}

                  {currentNode.image && (
                    <img src={currentNode.image} alt="Context" className="mb-6 max-h-64 md:max-h-80 lg:max-h-96 w-auto rounded-2xl mx-auto border border-slate-100 shadow-sm object-contain" />
                    )}

                   {currentNode.questionQuery && (
                      <div className="text-lg font-medium text-slate-600 mb-8 leading-relaxed whitespace-pre-wrap">
                      {currentNode.questionQuery}
                      </div>
                    )}

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      {(currentNode.options || []).map((opt, i) => (
                        <OptionButton key={opt.id} opt={opt} index={i} onSelect={handleOptionSelect} />
                      ))}
                    </div>
                 </div>
              </div>

            </div>
          </div>

          {scaffolding && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in">
            <div className="bg-white rounded-[2rem] max-w-md md:max-w-2xl lg:max-w-3xl w-full shadow-2xl overflow-hidden transform transition-all scale-100">
                  {(() => {
                      const fbColors = {
                          correct: { bg: 'bg-green-500', hover: 'hover:bg-green-600', shadow: 'shadow-green-500/30', title: 'Benar Sekali! 🤩' },
                          incorrect: { bg: 'bg-red-500', hover: 'hover:bg-red-600', shadow: 'shadow-red-500/30', title: 'Kurang Tepat 😕' },
                          neutral: { bg: 'bg-blue-500', hover: 'hover:bg-blue-600', shadow: 'shadow-blue-500/30', title: 'Informasi 🤔' }
                      };
                      const type = scaffolding.type === 'none' ? (scaffolding.isCorrect ? 'correct' : 'incorrect') : (scaffolding.type || 'incorrect');
                      const theme = fbColors[type] || fbColors.incorrect;
                      
                      return (
                          <>
                              <div className={`p-6 text-white text-center ${theme.bg}`}>
                                 <h3 className="text-2xl font-black">{theme.title}</h3>
                              </div>
                              <div className="p-8 text-center">
                                 {scaffolding.image && <img src={scaffolding.image} alt="Scaffolding" className="mb-6 max-h-48 md:max-h-96 md:w-full object-contain mx-auto rounded-xl shadow-md border border-slate-100" />}
                                 <div className="text-slate-600 font-medium text-lg leading-relaxed mb-8 whitespace-pre-wrap" dangerouslySetInnerHTML={{__html: scaffolding.text}}></div>
                                 <button onClick={scaffolding.onContinue} className={`w-full py-4 text-white rounded-2xl font-bold text-lg shadow-lg transition-all ${theme.bg} ${theme.hover} ${theme.shadow}`}>
                                   {scaffolding.buttonText || 'Lanjut'}
                                 </button>
                              </div>
                          </>
                      )
                  })()}
               </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
